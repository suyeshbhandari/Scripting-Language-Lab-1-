<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Country Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>50 Countries List</h2>
    <div id="table-container"></div>

    <script>
        // Array of 50 countries
        const countries = [
            "Argentina", "Australia", "Austria", "Bangladesh", "Belgium", "Brazil",
            "Canada", "Chile", "China", "Colombia", "Denmark", "Egypt",
            "Finland", "France", "Germany", "Greece", "India", "Indonesia",
            "Iran", "Ireland", "Italy", "Japan", "Kenya", "Malaysia",
            "Mexico", "Morocco", "Netherlands", "New Zealand", "Nigeria", "Norway",
            "Pakistan", "Peru", "Philippines", "Poland", "Portugal", "Russia",
            "Saudi Arabia", "Singapore", "South Africa", "South Korea", "Spain", "Sweden",
            "Switzerland", "Thailand", "Turkey", "Ukraine", "United Kingdom", "United States",
            "Vietnam", "Zimbabwe"
        ];

        function generateTable(data, colsPerRow) {
            let table = '<table><tr>';
            
            data.forEach((country, index) => {
                // Start a new row after filling the specified number of columns
                if (index > 0 && index % colsPerRow === 0) {
                    table += '</tr><tr>';
                }
                table += `<td>${country}</td>`;
            });

            // Fill remaining empty cells if the last row is incomplete
            const remainingCells = colsPerRow - (data.length % colsPerRow);
            if (remainingCells < colsPerRow) {
                for (let i = 0; i < remainingCells; i++) {
                    table += '<td></td>';
                }
            }

            table += '</tr></table>';
            return table;
        }

        // Render the table inside the div container
        document.getElementById('table-container').innerHTML = generateTable(countries, 6);
    </script>

</body>
</html>
