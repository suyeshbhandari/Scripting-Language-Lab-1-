  <title>Q15</title>
  <script>
    let color = [
"Blue",
"Green",
"Red",
"Orange",
"Violet",
"Indigo",
"Yellow"
];


let suffix = ["th","st","nd","rd"];


for(let i=0;i<color.length;i++){

    let choice;

    if(i+1 <= 3)
        choice = suffix[i+1];
    else
        choice = suffix[0];


    console.log(`${i+1}${choice} choice is ${color[i]}.`);
}
  </script>
