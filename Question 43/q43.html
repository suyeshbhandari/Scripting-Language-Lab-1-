<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Registration Form</h2>
    <form id="regForm" novalidate>
      
      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" placeholder="John Doe">
        <small class="error-msg" id="nameError"></small>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address *</label>
        <textarea id="address" name="address" rows="2" placeholder="Street, City, Country"></textarea>
        <small class="error-msg" id="addressError"></small>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username" placeholder="john_doe123">
        <small class="error-msg" id="usernameError"></small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" placeholder="john@example.com">
        <small class="error-msg" id="emailError"></small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password" placeholder="Min 8 chars, 1 upper, 1 lower, 1 digit, 1 special">
        <small class="error-msg" id="passwordError"></small>
      </div>

      <!-- Website -->
      <div class="form-group">
        <label for="website">Website</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">
        <small class="error-msg" id="websiteError"></small>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="text" id="phone" name="phone" placeholder="98XXXXXXXX">
        <small class="error-msg" id="phoneError"></small>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender *</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <small class="error-msg" id="genderError"></small>
      </div>

      <!-- Course -->
      <div class="form-group">
        <label for="course">Course *</label>
        <select id="course" name="course">
          <option value="">-- Select a Course --</option>
          <option value="bca">BCA</option>
          <option value="csit">BSc CSIT</option>
          <option value="bim">BIM</option>
          <option value="bit">BIT</option>
        </select>
        <small class="error-msg" id="courseError"></small>
      </div>

      <button type="submit" id="submitBtn">Register</button>
      <div id="successMessage" class="success-msg"></div>
    </form>
  </div>

  <script src="script43.js"></script>
</body>
</html>
