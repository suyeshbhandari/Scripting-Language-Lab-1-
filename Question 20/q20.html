  <script>
    function getDaysDifference(start,end){

    let difference = end - start;

    return Math.floor(
        difference/(1000*60*60*24)
    );

}


let start = new Date("2026-02-09");
let end = new Date("2026-02-20");


console.log(getDaysDifference(start,end));
