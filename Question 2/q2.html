function alphabetizeInput() {

    const userInput = prompt("Enter a string to alphabetize:");

    if (userInput === null) {
        console.log("Input canceled.");
        return;
    }


    const sortedString = [...userInput]
                            .sort()
                            .join('');


    console.log("Sorted result: " + sortedString);
}
