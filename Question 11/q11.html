<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q11</title>
  <script>
        // Accept number of integers
let n = parseInt(prompt("Enter number of integers:"));

let numbers = [];
    // Taking input
for(let i = 0; i < n; i++) {

    let num = parseInt(prompt("Enter number " + (i + 1) + ":"));

    numbers.push(num);
}


// Assume first element is smallest
let smaller = numbers[0];


// Compare all elements
for(let i = 1; i < numbers.length; i++) {

    if(numbers[i] < smaller) {
        smaller = numbers[i];
    }
}


// Display result
console.log("Array: " + numbers);
console.log("smallest number is: " + smaller);
  </script>
</head>
