  <title>Q26</title>
  <script>
    function tenMostFrequentWords(str){

    let words = str
    .toLowerCase()
    .split(" ");


    let count = {};


    for(let word of words){

        if(word in count)
            count[word]++;
        else
            count[word]=1;

    }


    let result = Object.entries(count);


    result.sort(
        (a,b)=> b[1]-a[1]
    );


    return result.slice(0,10);

}



let input = prompt("Enter a sentence:");

console.log(
tenMostFrequentWords(input)
);
  </script>
