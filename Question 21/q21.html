  <script>
    function getWeekendDate(){

    let today = new Date();

    let day = today.getDay();

    let daysLeft = 6 - day;


    today.setDate(
        today.getDate()+daysLeft
    );


    return today;
}


console.log(getWeekendDate());
  </script>
