function countVowels(str) {

    let count = 0;


    for (let i = 0; i < str.length; i++) {

        let ch = str[i].toLowerCase();


        if (
            ch === 'a' ||
            ch === 'e' ||
            ch === 'i' ||
            ch === 'o' ||
            ch === 'u'
        ) {

            count++;
        }
    }


    return count;
}



let text = prompt("Enter a string to count vowels:");

let result = countVowels(text);
